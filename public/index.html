<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DIU Dash</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="min-h-screen bg-navy text-white font-sans">
  <header class="p-4 text-center">
    <h1 class="text-3xl font-extrabold text-daff">🌼 DIU DASH</h1>
    <p class="text-sm text-slate-300">Daffodil International University Edition: survive to graduation</p>
  </header>

  <main class="max-w-6xl mx-auto p-4 grid gap-4 lg:grid-cols-[1fr_280px]">
    <section class="relative rounded-xl overflow-hidden border-2 border-daff">
      <canvas id="game" class="w-full block bg-black touch-none"></canvas>

      <div id="overlay" class="absolute inset-0 bg-navy/85 flex flex-col items-center justify-center gap-3 p-4 text-center">
        <h2 id="title" class="text-3xl font-bold text-daff">Ready for class?</h2>
        <p id="msg" class="text-slate-200">Press SPACE / ↑ / tap to jump. Hold to keep jumping.</p>
        <input id="name" maxlength="16" placeholder="Your name"
               class="px-3 py-2 rounded bg-white text-navy text-center font-semibold" />
        <button id="start" class="px-6 py-2 rounded-lg bg-daff text-navy font-bold hover:bg-yellow-300">▶ Start</button>
      </div>

      <button id="mute" class="absolute top-2 right-2 px-3 py-1 rounded bg-navy/70 border border-daff text-sm">🔊</button>
    </section>

    <aside class="rounded-xl border-2 border-diu p-4 bg-navy/60">
      <h3 class="text-xl font-bold text-diu mb-2">🏆 Leaderboard</h3>
      <ol id="board" class="space-y-1 text-sm"></ol>
    </aside>
  </main>

  <script src="/game.js"></script>
</body>
</html>
